<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン画面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 bg-white py-3">
                <form th:action="@{/login}" th:object="${loginDto}" method="post">
                    <div class="form-title">
                        <h1 class="h3 bg-primary text-white py-3 text-center rounded">ログイン</h1>
                    </div>

                    <div class="form-body">
                        <div class="row mb-4 mt-5 mx-2">
                            <label class="col-sm-3 col-form-label" for="email">メールアドレス<span class="text-danger"> * </span></label>
                            <div class="col-sm-9">
                                <input type="email" id="email" th:field="*{email}" class="form-control required">
                            </div>
                        </div>

                        <div class="row mb-5 pt-2 mx-2">
                            <label class="col-sm-3 col-form-label" for="password">パスワード<span class="text-danger"> * </span></label>
                            <div class="col-sm-9">
                                <input type="password" id="password" th:field="*{password}" class="form-control required">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-5 justify-content-center">
                        <button type="submit" class="btn btn-primary">ログイン</button>
                        <a th:href="@{/new/form}" class="btn btn-outline-secondary">新規登録はこちら</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
