<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フォーム編集</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white">
                <form th:action="@{/booking/update/confirm/{id}(id=${bookingDto.id})}" th:object="${bookingDto}" method="post">
                    <div class="form-title">
                        <h1 class="h2 bg-primary text-white text-center mt-3 py-2 rounded">フォーム編集</h1>
                    </div>
                    <div class="form-body">
                        <input type="hidden" th:field="*{id}">

                        <label class="form-label" for="name">名前</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>

                        <label class="form-label" for="nameKana">ナマエ</label>
                        <input type="text" class="form-control" id="nameKana" th:field="*{nameKana}" required>

                        <label class="form-label" for="email">メールアドレス</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" required>
                        
                        <label class="form-label" for="phone">電話番号</label>
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}">

                        <label class="form-label" for="address">住所</label>
                        <input type="text" class="form-control" id="address" th:field="*{address}">

                        <label class="form-label" for="stage">ステージ</label>
                        <select class="form-select" id="stage" th:field="*{stageId}" required>
                            <option value="" disabled selected>ステージを選択してください</option>
                            <option th:each="stage : ${stages}" th:value="${stage.id}" th:text="${stage.name}">1st</option>
                        </select>

                        <label class="form-label" for="staff">スタッフ</label>
                        <select class="form-select" id="staff" th:field="*{staffId}">
                            <option value="">スタッフを選択してください</option>
                            <option th:each="staff : ${staffs}" th:value="${staff.id}" th:text="${staff.name}">山田太郎</option>
                        </select>

                        <label class="form-label" for="paymentMethod">支払方法</label>
                        <select class="form-select" id="paymentMethod" th:field="*{paymentMethod}" required>
                            <option value="" disabled selected>支払方法を選択してください</option>
                            <option th:each="paymentMethod : ${paymentMethods}" th:value="${paymentMethod}" th:text="${paymentMethod.label}">当日現金</option>
                        </select>

                        <div th:each="ticketType, stat: ${ticketTypes}">
                            <label class="form-label" for="ticketType" th:text="${ticketType.name}">招待</label>
                            <input type="hidden" th:field="*{bookingDetails[__${stat.index}__].ticketTypeId}">
                            <input type="number" class="form-control" th:field="*{bookingDetails[__${stat.index}__].quantity}" min="0">
                        </div>

                        <label class="form-label" for="remarks">備考</label>
                        <input type="text" class="form-control" th:field="*{remarks}" id="remarks">
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary mb-3">確認する</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
