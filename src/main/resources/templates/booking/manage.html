<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container py-3 bg-white">
        <div class="row justify-content-between">
            <div class="col-md-6">
                <h1 class="h2 bg-primary text-white text-center py-2 mb-3 rounded">予約確認</h1>
                <table class="table">
                    <tr>
                        <th>名前</th>
                        <td th:text="${booking.name}">小林瑞歩</td>
                    </tr>
                    <tr>
                        <th>email</th>
                        <td th:text="${booking.email}">example@example.com</td>
                    </tr>
                    <tr>
                        <th>電話番号</th>
                        <td th:text="${booking.phone}">09012345678</td>
                    </tr>
                    <tr>
                        <th>ステージ</th>
                        <td th:text="${booking.stage.name}">1st</td>
                    </tr>
                    <div th:each="bookingDetail:${booking.bookingDetails}">
                        <th th:text="${bookingDetail.ticketType.name}"></th>
                        <td th:text="${bookingDetail.quantity}"></td>
                    </div>
                    <tr>
                        <th>スタッフ</th>
                        <td th:text="${booking.staff.name}">山田太郎</td>
                    </tr>
                    <tr>
                        <th>備考</th>
                        <td th:text="${booking.remarks}">備考内容</td>
                    </tr>
                    <!-- ・ステージ、スタッフ、チケット枚数は数字ではなく文字が表示されるようにする
                         ・チケット枚数系をきちんと表示させる
                         ・電話番号、住所備考等はnullの場合は表示しないようにする
                         ・合計金額が表示されるようにする。
                         ・支払い済みか否かも表示されるようにする。 -->
                </table>

                <form th:action="@{/booking/update/form/{id}(id=${booking.id})}" method="get">
                    <button type="submit" class="btn btn-primary">予約を変更</button>
                </form>
                <form th:action="@{/booking/delete/customer/{id}(id=${booking.id})}" method="post"
                    onsubmit="return confirm('予約を削除しますか？')" style="display: inline">
                    <button type="submit" class="btn btn-danger" id="delete-btn">予約を削除</button>
                </form>
            </div>

        </div>
    </div>
</body>
</html>
