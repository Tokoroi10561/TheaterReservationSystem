<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container bg-light py-3 col-md-6">
        <div class="row align-items-center justify-content-center">
            <div class="col-md-6">
                <h1 class="h3 text-center bg-primary mt-3 text-white p-3 rounded">予約確認</h1>
                <div class="form-group text-dark">
                    <p><strong>名前:</strong><span th:text="${bookingDto.name}"></span></p>
                    <p><strong>メールアドレス:</strong><span th:text="${bookingDto.email}"></span></p>
                    <p><strong>電話番号:</strong><span th:text="${bookingDto.phone}"></span></p>
                    <p><strong>住所:</strong><span th:text="${bookingDto.address}"></span></p>

                    <!-- 数字ではなく文字が表示されるようにする -->

                    <p><strong>ステージ:</strong><span th:text="${bookingDto.stageId}"></span></p>
                    <p><strong>スタッフ:</strong><span th:text="${bookingDto.staffId}"></span></p>
                    <div th:each="bookingDetail, stat:${bookingDto.bookingDetails}">
                        <p><strong th:text="${bookingDetail.ticketTypeId}"></strong>: <span th:text="${bookingDetail.quantity}"></span></p>
                    </div>
                    <p><strong>備考:</strong><span th:text="${bookingDto.remarks}"></span></p>

                    <form th:action="@{/booking/form/{showId}/register(showId=1)}" method="post">
                        <button type="submit" class="btn btn-primary">予約する</button>
                        <button type="button" class="btn btn-secondary" onclick="history.back()">戻る</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
