<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-light">
                <h1 class="bg-primary text-white text-center mt-3 rounded py-3">予約一覧</h1>
                <div th:unless="${bookingList}">
                    <p>現在予約はありません</p>
                </div>
                <div th:if="{bookingList}">
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>名前(ナマエ)</th>
                                <th>メールアドレス</th>
                                <th>ステージ</th>
                                <!-- <th>チケット種別</th> -->
                                <th>スタッフ扱い</th>
                                <th>予約日時</th>
                                <th>ステータス</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="booking: ${bookingList}">
                                <td>
                                    <a th:href="@{/booking/detail/${booking.id}}" th:text="${booking.name}"></a>
                                    <p>(<span th:text="${booking.nameKana}"></span>)</p>
                                </td>
                                <td th:text="${booking.email}"></td>
                                <td th:text="${booking.stage.name}"></td>
                                <!-- チケット種別 -->
                                <td th:text="${booking.createdAt}"></td>
                                <td th:text="${booking.bookingStatus}"></td>
                                <td>
                                    <a th:href="@{/booking/update/form/{id}(id=${booking.id})}" class="btn btn-primary">編集</a>
                                    <form th:action="@{/booking/delete/{id}(id=${booking.id})}" method="post"
                                        onsubmit="return confirm('予約を削除しますか？')" style="display: inline">
                                        <button type="submit" class="btn btn-danger" id="delete-btn">予約を削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
