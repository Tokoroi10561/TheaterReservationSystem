<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-light">
                <div th:object="${booking}">
                    <h1 class="h3 text-center bg-primary mt-3 text-light py-3 rounded">予約詳細</h1>
                    <table class="table">
                    <tr>
                        <th>名前</th>
                        <td th:text="*{name}"></td>
                    </tr>
                    <tr>
                        <th>ナマエ</th>
                        <td th:text="*{nameKana}"></td>
                    </tr>
                    <tr>
                        <th>email</th>
                        <td th:text="*{email}">example@example.com</td>
                    </tr>
                    <tr>
                        <th>電話番号</th>
                        <td th:text="*{phone}">09012345678</td>
                    </tr>
                    <tr>
                        <th>住所</th>
                        <td th:text="*{address}"></td>
                    </tr>
                    <tr>
                        <th>ステージ</th>
                        <td th:text="*{stage.name}">1st</td>
                    </tr>
                    <div th:each="bookingDetail: *{bookingDetails}">
                        <th th:text="${bookingDetail.ticketType.name}"></th>
                        <td th:text="${bookingDetail.quantity}"></td>
                    </div>
                    <tr>
                        <th>スタッフ</th>
                        <td th:text="*{staff.name}">山田太郎</td>
                    </tr>
                    <tr>
                        <th>支払い方法</th>
                        <td th:text="${booking.paymentMethod.label}"></td>
                    </tr>
                    <!-- <tr>
                        <th>支払い状況</th>
                        <td th:text="${booking.paymentStatus.label}"></td>
                    </tr> -->
                    <tr>
                        <th>予約状況</th>
                        <td th:text="${booking.bookingStatus.label}"></td>
                    </tr>
                    <tr>
                        <th>備考</th>
                        <td th:text="*{remarks}">備考内容</td>
                    </tr>
                </table>
                <form th:action="@{/booking/update/form/{id}(id=${booking.id})}" method="get">
                    <button type="submit" class="btn btn-primary">予約を変更</button>
                </form>
                <form th:action="@{/booking/delete/{id}(id=${booking.id})}" method="post"
                    onsubmit="return confirm('予約を削除しますか？')" style="display: inline">
                    <button type="submit" class="btn btn-danger" id="delete-btn">予約を削除</button>
                </form>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</body>
</html>
