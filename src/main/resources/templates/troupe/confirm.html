<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇団情報更新確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-light">
                <h1 class="h3 bg-primary text-light text-center py-3 my-3 rounded">劇団情報確認</h1>
                <div th:object="${troupeDto}">
                    <p><strong>劇団名: </strong><span th:text="*{name}"></span></p>
                    <p><strong>メールアドレス: </strong><span th:text="*{email}"></span></p>
                    <p><strong>署名: </strong><span th:text="*{signature}"></span></p>

                    <form th:action="@{/troupe/register/{troupeId}(troupeId=*{id})}" method="post">
                        <button type="submit" class="btn btn-primary">更新</button>
                    </form>
                    <button type="button" class="btn btn-secondary" onclick="history.back()">戻る</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
