<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇団情報更新フォーム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-light">
                <form th:action="@{/troupe/confirm/{troupeId}(troupeId=*{id})}" th:object="${troupeDto}" method="post">
                    <div class="form-title">
                        <h1 class="h3 bg-primary text-light text-center rounded py-3 my-3">劇団情報更新フォーム</h1>
                    </div>
                    <div class="form-body">
                        <input type="hidden" th:field="*{id}">
                        <label class="form-label" for="name">劇団名<span class="text-danger"> * </span></label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" required>

                        <label class="form-label" for="email">メールアドレス<span class="text-danger"> * </span></label>
                        <input type="email" class="form-control" id="email" th:field="*{email}" required>

                        <label class="form-label" for="signature">署名</label>
                        <input type="text" class="form-control" id="signature" th:field="*{signature}">

                        <button type="submit" class="btn btn-primary">確認</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
