<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇団情報詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-light">
                <div th:object="${troupe}">
                    <h1 class="h3 bg-primary text-light text-center py-3 my-3 rounded">劇団情報詳細</h1>
                    <P><strong>劇団名: </strong><span th:text="*{name}"></span></P>
                    <P><strong>メールアドレス: </strong><span th:text="*{email}"></span></P>
                    <P><strong>SNSアカウント: </strong><span th:text="*{snsAccount}"></span></P>
                    <P><strong>メール署名: </strong><span th:text="*{signature}"></span></P>

                    <a th:href="@{/troupe/form/{troupeId}(troupeId=*{id})}" class="btn btn-primary">編集</a>
                    <form th:action="@{/troupe/delete/{troupeId}(troupeId=*{id})}" method="post"
                        onsubmit="return confirm('劇団を削除しますか？')" style="display: inline">
                        <button type="submit" class="btn btn-danger">削除</button>
                    </form>
                    <a th:href="@{/show/list/{troupeId}(troupeId=*{id})}" class="btn btn-success">公演一覧</a>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dissmissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</body>
</html>
