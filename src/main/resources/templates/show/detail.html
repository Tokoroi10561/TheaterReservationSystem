<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公演詳細</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white">
                <h1 class="h3 text-center bg-primary mt-3 text-white p-3 rounded">公演詳細</h1>
                
                <div th:object="${show}">
                    <p><strong>公演タイトル：</strong> <span th:text="*{title}"></span></p>
                    <p><strong>公演場所：</strong> <span th:text="*{place}"></span></p>
                    <!-- <p><strong>フライヤー画像：</strong> <span th:text="*{flyerImage}"></span></p> -->
                    <div th:each="ticketType: *{ticketTypes}">
                        <p><strong>チケット種別：</strong> <span th:text="${ticketType.name}"></span></p>
                        <p><strong>価格：</strong> <span th:text="${ticketType.price}"></span></p>
                    </div>
                    <div th:each="stage: *{stages}">
                        <p><strong>ステージ名：</strong> <span th:text="${stage.name}"></span></p>
                        <p><strong>公演開始時間：</strong> <span th:text="${stage.startTime}"></span></p>
                        <p><strong>定員：</strong> <span th:text="${stage.capacity}"></span></p>
                    </div>
                    <div th:each="staff: *{staffs}">
                        <p><strong>スタッフ名：</strong> <span th:text="${staff.name}"></span></p>
                        <p><strong>所属：</strong> <span th:text="${staff.belong}"></span></p>
                    </div>
                    <div th:if="*{options != null and !options.empty}">
                        <p><strong>フォームオプション：</strong> </p>
                        <div th:each="option: *{options}">
                            <p><span th:text="${option.label}"></span></p>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a th:href="@{/show/update/form/{showId}(showId=${show.id})}" class="btn btn-primary">編集</a>
                    <form th:action="@{/show/delete/{showId}(id=${show.id})}" method="post"
                        onsubmit="return confirm('公演を削除しますか？')" style="display: inline">
                        <button type="submit" class="btn btn-danger" id="delete-btn">公演を削除</button>
                    </form>
                </div>
                <div class="text-center mt-3">
                    <a th:href="@{/show/list/{troupeId}(troupeId=${troupeId})}" class="btn btn-outline-primary">一覧に戻る</a>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</body>
</html>
