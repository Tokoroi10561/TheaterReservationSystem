<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公演情報更新 - 確認</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white">
                <div class="form-title">
                    <h1 class="h3 text-center bg-primary mt-3 text-white p-3 rounded">確認</h1>
                </div>
                <div th:object="${showDto}">
                    <p><strong>公演タイトル：</strong> <span th:text="*{title}"></span></p>
                    <p><strong>公演場所：</strong> <span th:text="*{place}"></span></p>
                    <p><strong>フライヤー画像：</strong> <span th:text="*{flyerImage}"></span></p>
                    <div th:each="ticketType, stat: *{ticketTypes}">
                        <p><strong>チケット種別：</strong> <span th:text="${ticketType[__${stat.index}__].name}"></span></p>
                        <p><strong>価格：</strong> <span th:text="${ticketType[__${stat.index}__].price}"></span></p>
                    </div>
                    <div th:each="stage, stat: *{stages}">
                        <p><strong>ステージ名：</strong> <span th:text="${stage[__${stat.index}__].name}"></span></p>
                        <p><strong>公演開始時間：</strong> <span th:text="${stage[__${stat.index}__].startTime}"></span></p>
                        <p><strong>定員：</strong> <span th:text="${stage[__${stat.index}__].capacity}"></span></p>
                    </div>
                    <div th:each="staff, stat: *{staffs}">
                        <p><strong>スタッフ名：</strong> <span th:text="${staff[__${stat.index}__].name}"></span></p>
                        <p><strong>所属：</strong> <span th:text="${staff[__${stat.index}__].belong}"></span></p>
                    </div>
                    <div th:if="!*{options.empty()}">
                        <p><strong>フォームオプション：</strong> </p>
                        <div th:each="option: ${showOptions}">
                            <p><span th:text="${option}"></span></p>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary mt-3 mb-3" onclick="history.back()">戻る</button>
                    <form th:action="@{/show/register/{showId}(showId=${showId})}" method="post">
                        <button type="submit" class="btn btn-primary mt-3 mb-3">登録</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
