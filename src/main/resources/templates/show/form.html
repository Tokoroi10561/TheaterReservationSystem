<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公演情報登録</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script th:src="@{/js/dynamic-form.js}"></script>

</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white">
                <form th:action="@{/show/confirm/{troupeId}(troupeId=${troupeId})}" th:object="${showDto}" method="post" enctype="multipart/form-data">
                    <div class="form-groupe">
                        <div class="form-title">
                            <h1 class="h3 text-center bg-primary mt-3 text-white p-3 rounded">公演情報登録</h1>
                        </div>
                        <div class="form-body">
                            <label class="form-label" for="title">公演タイトル<span class="text-danger"> *</span></label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" required>
                            
                            <label class="form-label" for="place">公演場所</label>
                            <input type="text" class="form-control" id="place" th:field="*{place}">
<!-- 
                            <label class="form-label" for="flyerImage">フライヤー画像</label>
                            <input type="file" class="form-control" id="flyerImage" th:field="*{flyerImage}" accept=".pdf"> -->

                            <div id="ticketType-container">
                                <div th:each="ticketType, stat: *{ticketTypes}" class="mb-3 border p-3 rounded ticketType-row">
                                    <label class="form-label" th:for="${'ticketName' + stat.index}">チケット種別<span class="text-danger"> *</span></label>
                                    <input type="text" class="form-control" th:id="${'ticketName' + stat.index}" th:field="*{ticketTypes[__${stat.index}__].name}" required>
                                    <label class="form-label" th:for="${'ticketPrice' + stat.index}">価格<span class="text-danger"> *</span></label>
                                    <input type="number" class="form-control" th:id="${'ticketPrice' + stat.index}" th:field="*{ticketTypes[__${stat.index}__].price}" required>
                                    <button type="button" class="btn btn-outline-success add-btn" data-section="ticketType">
                                        <i class="bi bi-plus-lg"></i>追加
                                    </button>
                                </div>
                            </div>

                            <div id="stage-container">
                                <div th:each="stage, stat: *{stages}" class="mb-3 border p-3 rounded stage-row">
                                    <label class="form-label" th:for="${'stageName' + stat.index}">ステージ名<span class="text-danger"> *</span></label>
                                    <input type="text" class="form-control" th:id="${'stageName' + stat.index}" th:field="*{stages[__${stat.index}__].name}" required>
                                    <label class="form-label" th:for="${'startTime' + stat.index}">公演開始時間<span class="text-danger"> *</span></label>
                                    <input type="datetime-local" class="form-control" th:id="${'startTime' + stat.index}" th:field="*{stages[__${stat.index}__].startTime}" required>
                                    <label class="form-label" th:for="${'capacity' + stat.index}">定員<span class="text-danger"> *</span></label>
                                    <input type="number" class="form-control" th:id="${'capacity' + stat.index}" th:field="*{stages[__${stat.index}__].capacity}" required>
                                    <button type="button" class="btn btn-outline-success add-btn" data-section="stage">
                                        <i class="bi bi-plus-lg"></i>追加
                                    </button>
                                </div>
                            </div>

                            <div id="staff-container">
                                <div th:each="staff, stat: *{staffs}" class="mb-3 border p-3 rounded staff-row">
                                    <label class="form-label" th:for="${'staffName' + stat.index}">スタッフ名</label>
                                    <input type="text" class="form-control" th:id="${'staffName' + stat.index}" th:field="*{staffs[__${stat.index}__].name}">
                                    <label class="form-label" th:for="${'belong' + stat.index}">所属</label>
                                    <input type="text" class="form-control" th:id="${'belong' + stat.index}" th:field="*{staffs[__${stat.index}__].belong}">
                                    <button type="button" class="btn btn-outline-success add-btn" data-section="staff">
                                        <i class="bi bi-plus-lg"></i>追加
                                    </button>
                                </div>
                            </div>

                            <div th:each="option, stat: ${showOptions}">
                                <label class="form-label" th:for="${'option' + stat.index}" th:text="${option.label}">扱い有</label>
                                <input type="checkbox" class="form-check-input" th:id="${'option' + stat.index}" th:value="${option}" th:field="*{options}">
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary mt-3 mb-3">確認</button>
                </form>
            </div>
        </div>
    </div>
    
</body>
</html>
