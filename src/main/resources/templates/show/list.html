<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公演一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-white">
                <h1 class="h3 text-center bg-primary mt-3 text-white p-3 rounded">公演一覧</h1>
            </div>
            <div th:object="${showList}">
                <table class="table table-striped mt-3">
                    <thead>
                        <tr>
                            <th>公演タイトル</th>
                            <th>公演場所</th>
                            <th>フライヤー画像</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="show : *{shows}">
                            <td th:text="${show.title}"></td>
                            <td th:text="${show.place}"></td>
                            <td th:text="${show.flyer_image}"></td>
                            <td>
                                <a th:href="@{/show/update/form/{showId}(showId=${show.id})}" class="btn btn-primary">編集</a>
                                <a th:href="@{/show/delete/{showId}(showId=${show.id})}" class="btn btn-danger">削除</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
