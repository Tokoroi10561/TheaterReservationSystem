<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公演一覧</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 bg-white">
                <h1 class="h3 text-center bg-primary mt-3 text-white p-3 rounded">公演一覧</h1>
                <a th:href="@{/show/form/{troupeId}(troupeId=${troupeId})}" class="btn btn-primary">新規公演登録</a>
                <div th:unless="${showList}">
                    <p>公演が見つかりません。</p>
                </div>
                <div th:if="${showList}">
                    <table class="table table-striped mt-3">
                        <thead>
                            <tr>
                                <th>公演タイトル</th>
                                <th>公演場所</th>
                                <th>フライヤー画像</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="show : ${showList}">
                                <td th:text="${show.title}"></td>
                                <td th:text="${show.place}"></td>
                                <td th:text="${show.flyerImage}"></td>
                                <td>
                                    <a th:href="@{/show/update/form/{showId}(showId=${show.id})}" class="btn btn-primary">編集</a>
                                    <form th:action="@{/show/delete/{id}(id=${show.id})}" method="post"
                                        onsubmit="return confirm('公演を削除しますか？')" style="display: inline">
                                        <button type="submit" class="btn btn-danger" id="delete-btn">公演を削除</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</body>
</html>
