<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認フォーム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-body{
            margin-left: 10px;
            margin-right: 10px;
        }
    </style>
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white py-3 mt-5 ">
                <form th:active="@{/new/register}" th:object="${troupeDto}" method="post">
                    <div class="form-title">
                        <h1 class="h3 bg-primary text-white text-center py-2 rounded mb-3">登録情報確認</h1>
                    </div>

                    <div class="form-body">
                        <p class="form-control">名前<span class="text-danger"> * </span>： <span th:text="*{name}">山田太郎</p>
                        <p class="form-control">メールアドレス<span class="text-danger"> * </span>： <span th:text="*{email}">メールアドレス</span></p>
                        <p class="form-control">パスワード<span class="text-danger"> * </span>： <span th:text="*{password}">パスワード</span></p>
                        <p class="form-control">SNSアカウント： <span th:text="*{snsAccount}"></span></p>
                        <p class="form-control">署名： <span th:text="*{signature}"></span></p>

                        <button type="submit" class="btn btn-primary d-block mx-auto">登録する</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
