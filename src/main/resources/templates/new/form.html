<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規劇団登録フォーム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-body{
            margin-left: 10px;
            margin-right: 10px;
        }

        .row{
            margin-top: 10px;
        }
    </style>
</head>
<body class="bg-secondary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white py-3 mt-5">
                <form th:action="@{/new/confirm}" th:object="${troupeDto}" method="post">

                    <div class="form-title">
                        <h1 class="h3 bg-primary text-center text-white py-3 rounded mb-2">新規登録</h1>
                    </div>

                    <div class="form-body">
                        <!-- 劇団名 -->
                        <div class="row">
                            <label class="col-sm-3 col-form-label" for="name">劇団名<span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="text" id="name" th:field="*{name}" class="form-control" required>
                            </div>
                        </div>

                        <!-- メールアドレス -->
                        <div class="row">
                            <label class="col-sm-3 col-form-label" for="email">メールアドレス<span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="email" id="email" th:field="*{email}" class="form-control" required>
                            </div>
                        </div>

                        <!-- パスワード -->
                        <div class="row">
                            <label class="col-sm-3 col-form-label" for="password">パスワード<span class="text-danger">*</span></label>
                            <div class="col-sm-9">
                                <input type="password" id="password" th:field="*{password}" class="form-control" required>
                            </div>
                        </div>

                        <!-- SNSアカウント -->
                        <div class="row">
                            <label class="col-sm-3 col-form-label" for="sns-account">SNSアカウント</label>
                            <div class="col-sm-9">
                                <input type="text" id="sns-account" th:field="*{snsAccount}" class="form-control">
                            </div>
                        </div>

                        <!-- 署名 -->
                        <div class="row">
                            <label class="col-sm-3 col-form-label" for="signature">署名</label>
                            <div class="col-sm-9">
                                <input type="text" id="signature" th:field="*{signature}" class="form-control">
                            </div>
                        </div>

                        <!-- 送信ボタン（完全に中央に配置する場合） -->
                        <div class="row justify-content-center mt-4">
                            <div class="col-sm-6">
                                <button type="submit" class="btn btn-primary w-100">確認する</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
