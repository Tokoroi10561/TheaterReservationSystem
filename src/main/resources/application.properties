spring.application.name=TheaterReservaitonSystem

# DB接続設定
spring.datasource.url=jdbc:mysql://localhost:3306/theater_db?serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# メール送信設定 (Gmail例)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mizyu1110@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true